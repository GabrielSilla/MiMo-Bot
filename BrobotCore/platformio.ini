; Brobot Core — personality + display driving logic.
; vscreen=1 -> draw commands are sent over Serial to the Brobot Virtual Display (PC).
; vscreen=0 -> draw commands go to a physical ST7735S over SPI.

[env]
framework = arduino
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
monitor_speed = 115200

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
build_flags = -D VSCREEN=1

; Physical ST7735S wired to an Uno, once the display arrives:
[env:uno_physical]
platform = atmelavr
board = uno
build_flags = -D VSCREEN=0

; ESP32-C3 SuperMini.
[env:esp32dev]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags = -D VSCREEN=1

[env:esp32dev_physical]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags = -D VSCREEN=0
